[package]
name = "sievesci-desktop"
version = "0.2.1"
description = "SieveSci desktop shell: a window around `sievesci serve`"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
